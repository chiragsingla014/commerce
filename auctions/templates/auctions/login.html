{% extends "auctions/layout.html" %}

{% block body %}
    <div class="auth-container">
        <h2 class="auth-title">Log In</h2>
        {% if message %}
            <div class="alert alert-error">{{ message }}</div>
        {% endif %}
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input autofocus class="form-input" type="text" name="username" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" name="password" id="password" placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary form-submit">Log In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
{% endblock %}
