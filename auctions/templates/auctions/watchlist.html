{% extends "auctions/layout.html" %}

{% block body %}
    <h1 class="page-title">My Watchlist</h1>
    {% for element in watchlist %}
        <div class="watchlist-item">
            <a href="{% url 'view_listing' element.listing.id %}">{{ element.listing.title }}</a>
            <span class="price">Rs.{{ element.listing.current_price }}</span>
        </div>
    {% empty %}
        <p>Your watchlist is empty.</p>
    {% endfor %}
{% endblock %}
