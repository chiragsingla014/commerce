{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auctions{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'auctions/styles.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="{% url 'index' %}" class="nav-brand">ShareCycle</a>
            <div class="nav-menu">
                <a href="{% url 'index' %}" class="nav-link">Active</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'category' %}" class="nav-link">Categories</a>
                    <a href="{% url 'create_listing' %}" class="nav-link">Create</a>
                    <a href="{% url 'watchlist' %}" class="nav-link">Watchlist</a>
                    <a href="{% url 'my_pickups' %}" class="nav-link">My Pickups</a>
                    <a href="{% url 'logout' %}" class="nav-link">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-link">Login</a>
                    <a href="{% url 'register' %}" class="nav-link">Register</a>
                {% endif %}
            </div>
            <span class="nav-user">
                {% if user.is_authenticated %}{{ user.username }}{% else %}Guest{% endif %}
            </span>
        </div>
    </nav>

    <main class="main">
        {% block body %}{% endblock %}
    </main>
</body>
</html>
